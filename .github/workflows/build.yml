name: Build Windows ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 portable ZIP
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: work/BottomScreen-AutoCursor/packages.lock.json

      - name: Build, package and verify
        id: package
        run: ./scripts/build.ps1

      - name: Upload portable ZIP
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.zip_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Write download summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          BUILD_VERSION: ${{ steps.package.outputs.version }}
          EXE_SHA256: ${{ steps.package.outputs.exe_sha256 }}
          ZIP_SHA256: ${{ steps.package.outputs.zip_sha256 }}
        run: |
          @"
          ## BottomScreen $env:BUILD_VERSION

          [Download Windows x64 ZIP]($env:ARTIFACT_URL)

          - Self-contained portable build; no separate .NET installation required.
          - Versioned and fixed directories verified against the same executable.
          - ZIP executable verified after packaging.
          - EXE SHA256: ``$env:EXE_SHA256``
          - ZIP SHA256: ``$env:ZIP_SHA256``
          - Game capture, HDR and input-to-photon latency require testing on real hardware.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

